name: Build installers

# Every push to master builds the Windows and macOS installers. When the pom version
# has no release yet, the commit is tagged v<version> and released with all installers
# attached, so releasing means bumping <version> and <installer.version> in pom.xml.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-master:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the commit to be on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA is not on master; installers are only built from master."
            exit 1
          fi

      - id: version
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

  windows:
    needs: check-master
    runs-on: windows-latest
    steps:
      # Some source paths exceed the default Windows path limit.
      - run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The win64 zip (installer exe + bundled JRE) is assembled in the install phase.
      - run: mvn -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: esup-dss-client-win64
          path: target/esup-dss-client-win64.zip
          compression-level: 0

  macos:
    needs: check-master
    runs-on: macos-latest
    strategy:
      matrix:
        # JavaFX comes from the downloaded Zulu FX JRE, so one runner builds both architectures.
        profile: [ mac-x64, mac-aarch64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - run: mvn -B clean package -Dmac.os=true -P${{ matrix.profile }}

      - uses: actions/upload-artifact@v4
        with:
          name: esup-dss-client-${{ matrix.profile }}
          path: target/esup-dss-client-*.pkg
          compression-level: 0

  release:
    needs: [ check-master, windows, macos ]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.check-master.outputs.version }}
    steps:
      - name: Skip if this version is already released
        id: exists
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released; bump the version in pom.xml to publish a new one."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.released != 'true'
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - if: steps.exists.outputs.released != 'true'
        run: |
          cat > notes.md <<'EOF'
          Sensio build of esup-dss-client with a Czech and Slovak interface and working OpenSC tokens on Windows. The interface follows the system language (Czech, Slovak; otherwise English).

          ## Windows
          Download `esup-dss-client-win64.zip`, unzip it and run `esup-dss-client-installer.exe`. The installer isn't code-signed, so SmartScreen may warn: choose **More info → Run anyway**.

          ## macOS
          Download `esup-dss-client-aarch64.pkg` for Apple Silicon (M1 and newer) or `esup-dss-client-x64.pkg` for Intel Macs, and open it. The package isn't signed by Apple, so macOS blocks it the first time: open **System Settings → Privacy & Security** and click **Open Anyway**.
          EOF
          gh release create "$TAG" installers/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "esup-dss-client ${TAG#v}" --notes-file notes.md
